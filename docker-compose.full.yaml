services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: stu_manage
      MYSQL_USER: stu_app
      MYSQL_PASSWORD: change-me-before-use
      MYSQL_ROOT_PASSWORD: change-me-root-before-use
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 9090
      MYSQL_URL: jdbc:mysql://mysql:3306/stu_manage?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: stu_app
      MYSQL_PASSWORD: change-me-before-use
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-this-to-a-long-random-value
      SPRING_PROFILES_ACTIVE: demo
      UPLOAD_PATH: /var/lib/stu-manage/uploads
    ports:
      - "127.0.0.1:18090:9090"
    volumes:
      - app-uploads:/var/lib/stu-manage/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health | grep -q '\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  app-uploads:
