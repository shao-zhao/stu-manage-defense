spring.application.name=stu-backend
server.port=9090
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/stu_manage?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=false
#显示sql语句方便调试
upload.path=${UPLOAD_PATH:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.endpoints.web.exposure.include=health,info
app.jwt-secret=${JWT_SECRET:}
